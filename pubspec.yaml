name: aj_project
description: AJ Project - Retail Ice Cream Distribution Management System
publish_to: 'none'
version: 1.0.0+1
environment:
  sdk: '>=3.3.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  # State management
  flutter_riverpod: ^2.5.1
  # Localization
  flutter_localizations:
    sdk: flutter
  # Networking
  http: ^1.2.1
  # Local persistence (auth token, theme/lang/font prefs)
  shared_preferences: ^2.2.3
  # Formatting
  intl: ^0.20.2
  # Charts (Sales / Earnings bar chart)
  fl_chart: ^0.68.0
  # Image picking (company logo upload)
  image_picker: ^1.1.2
  # PDF preview / printing for bills
  printing: ^5.13.1
  pdf: ^3.11.0
  # Bluetooth thermal receipt printer (portable ESC/POS printer support)
  # Pinned to 1.2.1: 1.2.2+ requires Flutter SDK >=3.44.0 (Swift Package
  # Manager migration for iOS/macOS). Bump this once the project's Flutter
  # SDK is upgraded to 3.44+.
  print_bluetooth_thermal: 1.2.1
  esc_pos_utils_plus: ^2.0.4
  url_launcher: ^6.3.0
  video_player: ^2.11.1
  firebase_core: ^4.11.0
  cloud_firestore: ^6.6.0
  # Push notifications (FCM) + local notification display + app-icon badge
  firebase_messaging: ^16.4.3
  flutter_local_notifications: ^18.0.1
  app_badge_plus: ^1.2.4
  permission_handler: ^12.0.3
  image: ^4.0.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/videos/splash.mp4
    - assets/images/
