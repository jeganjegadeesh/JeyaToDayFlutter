name: aj_project
description: AJ Project - Retail Ice Cream Distribution Management System
publish_to: 'none'
version: 1.0.0+1
environment:
  sdk: '>=3.3.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  # State management
  flutter_riverpod: ^2.5.1
  # Localization
  flutter_localizations:
    sdk: flutter
  # Networking
  http: ^1.2.1
  # Local persistence (auth token, theme/lang/font prefs)
  shared_preferences: ^2.2.3
  # Formatting
  intl: ^0.20.2
  # Charts (Sales / Earnings bar chart)
  fl_chart: ^0.68.0
  # Image picking (company logo upload)
  image_picker: ^1.1.2
  # PDF preview / printing for bills
  printing: ^5.13.1
  pdf: ^3.11.0
  url_launcher: ^6.3.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
