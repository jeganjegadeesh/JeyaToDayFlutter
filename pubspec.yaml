name: jeyatoday
description: "Ice Cream Distribution System"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # HTTP & API
  dio: ^5.4.0

  # State Management
  flutter_riverpod: ^2.5.1

  # Local Storage
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.0.0

  # UI
  cupertino_icons: ^1.0.6
  google_fonts: ^6.2.1

  # Utils
  intl: ^0.20.2
  equatable: ^2.0.5

  # Responsive
  flutter_screenutil: ^5.9.0

  # Print / PDF
  pdf: ^3.10.8
  printing: ^5.12.0

  # Theme
  flex_color_picker: ^3.3.0

  # Localization
  flutter_localizations:
    sdk: flutter
  flutter_gen: ^5.13.0+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/